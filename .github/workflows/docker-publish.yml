# .github/workflows/docker-publish.yml (多架构构建版 - amd64 + arm64)
name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: ["main", "arm-support"]
    tags: ["v*"]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Camoufox version
        id: get_camoufox
        run: |
          # 获取 Camoufox 最新版本号
          LATEST_TAG=$(curl -s "https://api.github.com/repos/daijro/camoufox/releases/latest" | grep '"tag_name"' | cut -d '"' -f 4)
          echo "Camoufox latest tag: $LATEST_TAG"
          echo "CAMOUFOX_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ais2api
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CAMOUFOX_VERSION=${{ env.CAMOUFOX_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
